<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="main-content">
            <h1>My Love, will you be my Valentine? 🌹</h1>
            
            <img src="us.jpg" id="couple-photo" alt="Us together">

            <div class="buttons">
                <button id="yesBtn" onclick="sayYes()">YES! ❤️</button>
                <button id="noBtn" onmouseover="moveButton(event)" onclick="moveButton(event)">No 😢</button>
            </div>
        </div>

        <div id="success-message" class="hidden">
            <h1>YAY! I knew you'd say Yes! 💖</h1>
            <p>Best Valentine's ever! 🏰✨</p>
            
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbDN4eHM3N3FtcGZ1bWJ2YnduM254dzJmaW5jeGZ6Y2t6Z2Z5aWZ4ZiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/MDJ9IbxxvDUQM/giphy.gif" alt="Happy Calico Cat" class="success-gif">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
