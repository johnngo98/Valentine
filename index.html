<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shelby ❤️</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div id="main-content">
            <h1>Shelby, will you be my Valentine? 🌹</h1>
            
            <img src="us.jpg" 
                 id="couple-photo" 
                 alt="Us together">

            <div class="buttons">
                <button id="yesBtn" onclick="sayYes()">YES! ❤️</button>
                <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😢</button>
            </div>
        </div>

        <div id="success-message" class="hidden">
            <h1>YAY! I knew you'd say Yes! 💖</h1>
            <p>Best Valentine's ever! 🏰✨</p>
            
            <img src="https://media.giphy.com/media/26FLdmIp6wJr91JAI/giphy.gif" alt="Excited Cat" class="success-gif">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
